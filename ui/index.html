<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>TurnTabler</title><link rel="stylesheet" href="style.css"></head>
<body><main class="widget">
<section class="turntable" aria-label="유리 턴테이블"><div class="glass-light" aria-hidden="true"><canvas class="ambient-canvas" width="96" height="96"></canvas><canvas class="ambient-canvas" width="96" height="96"></canvas></div><img class="deck-image" src="assets/glass-turntable.png" alt="" draggable="false"><div class="platter"><div class="vinyl" aria-hidden="true"><canvas class="record-texture"></canvas><i></i></div><div class="projection"><div class="video-wash" aria-hidden="true"></div><div id="player"></div><div class="film" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div><button id="video-hit" aria-label="재생 또는 일시정지"></button></div></div><div class="deck-volume" title="??"><canvas class="fader-track" aria-hidden="true"></canvas><canvas class="fader-knob" aria-hidden="true"></canvas><input id="deck-volume" type="range" min="0" max="100" value="65" aria-label="??"></div><button id="settings-toggle" class="gear" title="설정" aria-label="설정" aria-expanded="false">⚙</button></section>
<form id="link-form"><button type="button" id="previous" aria-label="이전 영상" title="이전 영상">‹</button><label class="sr-only" for="url">유튜브 주소</label><input id="url" type="text" placeholder="YouTube URL" autocomplete="off" spellcheck="false" required><button type="button" id="next" aria-label="다음 영상" title="다음 영상">›</button></form><p id="status" role="status" hidden></p>
<section id="settings" hidden aria-label="설정"><div class="settings-head"><span>설정</span><button id="settings-close" aria-label="설정 닫기">×</button></div>
<label class="setting-row">항상 위에 표시<input id="pin" type="checkbox" checked></label><label class="setting-row">프로젝터 효과<input id="effect" type="checkbox" checked></label><label class="setting-row">영상 색 반사<input id="ambient" type="checkbox" checked></label><label class="setting-row">레코드 회전<input id="rotation" type="checkbox" checked></label>
<label class="setting-row">음량<input id="volume" type="range" min="0" max="100" value="65"></label><label class="setting-row">빛 강도<input id="light-strength" type="range" min="0" max="100" value="70"></label><label class="setting-row">크기<select id="size"><option value="0.8">작게</option><option value="1" selected>보통</option><option value="1.2">크게</option></select></label><label class="setting-row">모니터 모서리<select id="corner"><option value="bottom-right">오른쪽 아래</option><option value="bottom-left">왼쪽 아래</option><option value="top-right">오른쪽 위</option><option value="top-left">왼쪽 위</option></select></label><div id="playlist" hidden><label class="setting-row">재생목록<select id="tracks" aria-label="재생목록 영상"></select></label></div><div class="settings-actions"><button id="minimize">최소화</button><button id="close">종료</button></div></section>
</main><script src="art.js"></script><script src="youtube.js"></script><script src="app.js"></script></body></html>
